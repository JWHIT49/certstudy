name: Keep cloud project awake

# Free Supabase projects pause after a week without activity. This calls the public cs_ping() function twice a week.
# It does nothing unless cloud.json exists and has "enabled": true. GitHub stops scheduled workflows in a repository that has had no
# activity for 60 days; if that happens, re-enable it on the Actions tab (or push any change).

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: github.repository_owner == 'JWHIT49'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node tools/keepalive.mjs
